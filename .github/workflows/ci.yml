name: CI

on:
  push:
    branches:
      - main
      - 'release/**'

  pull_request:
    branches:
      - main
      - 'release/**'

  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Download dependencies
        run: go mod download all

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  secret-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: integration/secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Resolve integration dependencies
        run: go mod tidy
      - name: Vet integration
        run: go vet ./...
      - name: Test integration
        run: go test -race ./...
